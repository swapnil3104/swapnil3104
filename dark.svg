<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101F"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="border-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="33%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="66%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cyber-grid-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A101F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-ai-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bar-dev-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bar-ux-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    
    <style>
      .mono { font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .bold { font-weight: 700; }
      .dotted { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 2 6; }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.92); }
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbit-cw {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbit-ccw {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes logo-morph {
        0%, 30% { opacity: 1; transform: scale(1); }
        33%, 63% { opacity: 0; transform: scale(0.75); }
        66%, 96% { opacity: 0; transform: scale(0.75); }
      }
      @keyframes logo-morph-2 {
        0%, 30% { opacity: 0; transform: scale(0.75); }
        33%, 63% { opacity: 1; transform: scale(1); }
        66%, 96% { opacity: 0; transform: scale(0.75); }
      }
      @keyframes logo-morph-3 {
        0%, 63% { opacity: 0; transform: scale(0.75); }
        66%, 96% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.75); }
      }
      @keyframes eq-bounce-1 {
        0%, 100% { height: 8px; y: 337px; }
        50% { height: 22px; y: 323px; }
      }
      @keyframes eq-bounce-2 {
        0%, 100% { height: 20px; y: 325px; }
        50% { height: 6px; y: 339px; }
      }
      @keyframes eq-bounce-3 {
        0%, 100% { height: 12px; y: 333px; }
        50% { height: 26px; y: 319px; }
      }
      @keyframes eq-bounce-4 {
        0%, 100% { height: 24px; y: 321px; }
        50% { height: 10px; y: 335px; }
      }

      .live-dot { animation: pulse 2s infinite ease-in-out; transform-origin: 1015px 26px; }
      .radar { animation: radar-sweep 10s linear infinite; transform-origin: 190px 185px; }
      .orbit-ring-1 { animation: orbit-cw 16s linear infinite; transform-origin: 190px 185px; }
      .orbit-ring-2 { animation: orbit-ccw 22s linear infinite; transform-origin: 190px 185px; }
      
      .morph-1 { animation: logo-morph 9s infinite ease-in-out; transform-origin: 145px 140px; }
      .morph-2 { animation: logo-morph-2 9s infinite ease-in-out; transform-origin: 145px 140px; }
      .morph-3 { animation: logo-morph-3 9s infinite ease-in-out; transform-origin: 145px 140px; }

      .eq-bar-1 { animation: eq-bounce-1 1.2s infinite ease-in-out; }
      .eq-bar-2 { animation: eq-bounce-2 0.9s infinite ease-in-out; }
      .eq-bar-3 { animation: eq-bounce-3 1.5s infinite ease-in-out; }
      .eq-bar-4 { animation: eq-bounce-4 1.1s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Main Outer Frame with Gradient Border -->
  <rect x="2" y="2" width="1176" height="476" rx="14" fill="url(#bg-grad-dark)" stroke="url(#border-grad-dark)" stroke-width="2.5"/>

  <!-- Top macOS-style Terminal Header -->
  <path d="M 2 14 C 2 7 7 2 14 2 L 1166 2 C 1173 2 1178 7 1178 14 L 1178 50 L 2 50 Z" fill="#0B132B"/>
  <line x1="2" y1="50" x2="1178" y2="50" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Controls -->
  <circle cx="24" cy="26" r="6" fill="#EF4444"/>
  <circle cx="44" cy="26" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="26" r="6" fill="#10B981"/>

  <!-- Center Header Title -->
  <text x="590" y="31" text-anchor="middle" class="mono bold" font-size="13" fill="#94A3B8" letter-spacing="1">profile.sh --live --graphical-hud</text>

  <!-- Right Status Pill -->
  <rect x="990" y="15" width="172" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="1008" cy="27" r="4.5" fill="#EF4444" class="live-dot"/>
  <text x="1020" y="31" class="mono bold" font-size="10" fill="#EF4444" letter-spacing="0.5">LIVE</text>
  <text x="1058" y="31" class="mono" font-size="11" fill="#22D3EE">@swapnil3104</text>

  <!-- LEFT PANEL: VISUAL HUD & CYBER MATRIX -->
  <g transform="translate(30, 70)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="380" height="380" rx="10" fill="#0D1527" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Header Labels -->
    <rect x="15" y="14" width="105" height="22" rx="4" fill="#1E293B"/>
    <text x="67" y="29" text-anchor="middle" class="mono bold" font-size="10" fill="#A78BFA" letter-spacing="1">CYBER.HUD</text>
    <text x="365" y="29" text-anchor="end" class="mono" font-size="10" fill="#475569">SYS.ID // 3104</text>

    <!-- Glowing Background Radial Grid -->
    <circle cx="190" cy="185" r="135" fill="url(#cyber-grid-glow)"/>
    <circle cx="190" cy="185" r="135" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="190" cy="185" r="100" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="190" cy="185" r="65" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Crosshairs -->
    <line x1="190" y1="45" x2="190" y2="325" stroke="#1E293B" stroke-width="1"/>
    <line x1="50" y1="185" x2="330" y2="185" stroke="#1E293B" stroke-width="1"/>

    <!-- Orbital Particles & Rotating Rings -->
    <g class="orbit-ring-1">
      <circle cx="190" cy="85" r="3.5" fill="#22D3EE"/>
      <circle cx="290" cy="185" r="2.5" fill="#A78BFA"/>
    </g>
    <g class="orbit-ring-2">
      <circle cx="190" cy="285" r="3.5" fill="#10B981"/>
      <circle cx="90" cy="185" r="2.5" fill="#38BDF8"/>
    </g>

    <!-- Rotating Radar Line -->
    <g class="radar">
      <line x1="190" y1="185" x2="325" y2="185" stroke="#22D3EE" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Center Morphing Tech Logos -->
    <!-- Logo 1: AI / Brain / Neural Core -->
    <g class="morph-1">
      <g transform="translate(145, 140)">
        <rect x="0" y="0" width="90" height="90" rx="18" fill="#1E1B4B" stroke="#7C3AED" stroke-width="2"/>
        <path d="M 25 30 L 40 45 L 25 60 M 65 30 L 50 45 L 65 60 M 40 65 L 50 25" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="45" y="82" text-anchor="middle" class="mono bold" font-size="9" fill="#A78BFA">AI / NEURAL</text>
      </g>
    </g>

    <!-- Logo 2: Python / ML -->
    <g class="morph-2">
      <g transform="translate(145, 140)">
        <rect x="0" y="0" width="90" height="90" rx="18" fill="#062C43" stroke="#22D3EE" stroke-width="2"/>
        <path d="M 43 20 C 32 20 28 24 28 31 L 28 37 L 43 37 L 43 39 L 23 39 C 17 39 15 44 15 53 C 15 62 18 67 25 67 L 30 67 L 30 60 C 30 52 35 48 44 48 L 56 48 C 61 48 65 44 65 39 L 65 31 C 65 24 60 20 43 20 Z" fill="#22D3EE"/>
        <circle cx="34" cy="27" r="2.5" fill="#062C43"/>
        <path d="M 47 70 C 58 70 62 66 62 59 L 62 53 L 47 53 L 47 51 L 67 51 C 73 51 75 46 75 37 C 75 28 72 23 65 23 L 60 23 L 60 30 C 60 38 55 42 46 42 L 34 42 C 29 42 25 46 25 51 L 25 59 C 25 66 30 70 47 70 Z" fill="#10B981"/>
        <circle cx="56" cy="63" r="2.5" fill="#062C43"/>
        <text x="45" y="82" text-anchor="middle" class="mono bold" font-size="9" fill="#22D3EE">PYTHON / ML</text>
      </g>
    </g>

    <!-- Logo 3: React / Full-Stack Stack -->
    <g class="morph-3">
      <g transform="translate(145, 140)">
        <rect x="0" y="0" width="90" height="90" rx="18" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
        <ellipse cx="45" cy="45" rx="28" ry="10" fill="none" stroke="#10B981" stroke-width="2.5" transform="rotate(30 45 45)"/>
        <ellipse cx="45" cy="45" rx="28" ry="10" fill="none" stroke="#10B981" stroke-width="2.5" transform="rotate(90 45 45)"/>
        <ellipse cx="45" cy="45" rx="28" ry="10" fill="none" stroke="#10B981" stroke-width="2.5" transform="rotate(150 45 45)"/>
        <circle cx="45" cy="45" r="5" fill="#10B981"/>
        <text x="45" y="82" text-anchor="middle" class="mono bold" font-size="9" fill="#10B981">DEV / STACK</text>
      </g>
    </g>

    <!-- Audio Waveform Equalizer (Bottom Left Visualizer) -->
    <g transform="translate(20, 0)">
      <rect x="0" y="320" width="4" height="20" rx="2" fill="#22D3EE" class="eq-bar-1"/>
      <rect x="7" y="320" width="4" height="20" rx="2" fill="#A78BFA" class="eq-bar-2"/>
      <rect x="14" y="320" width="4" height="20" rx="2" fill="#10B981" class="eq-bar-3"/>
      <rect x="21" y="320" width="4" height="20" rx="2" fill="#38BDF8" class="eq-bar-4"/>
      <rect x="28" y="320" width="4" height="20" rx="2" fill="#A78BFA" class="eq-bar-1"/>
      <rect x="35" y="320" width="4" height="20" rx="2" fill="#22D3EE" class="eq-bar-3"/>
    </g>
    <text x="70" y="338" class="mono" font-size="9" fill="#64748B">AUDIO.FREQ // 44.1kHz ACTIVE</text>

    <!-- Bottom Status Bar -->
    <rect x="15" y="348" width="350" height="22" rx="5" fill="#1E293B"/>
    <text x="25" y="363" class="mono" font-size="10" fill="#10B981">STATUS: ONLINE</text>
    <text x="355" y="363" text-anchor="end" class="mono" font-size="10" fill="#A78BFA">NEURAL CORE v3.2</text>
  </g>

  <!-- RIGHT PANEL: SYSTEM SPECIFICATION & GRAPHICAL PROFICIENCY -->
  <g transform="translate(440, 70)">
    <!-- Right Panel Container -->
    <rect x="0" y="0" width="710" height="380" rx="10" fill="#0D1527" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Section Header -->
    <text x="25" y="32" class="mono bold" font-size="12" fill="#22D3EE" letter-spacing="1.5">SYSTEM.INFO // DEVELOPER SPECIFICATION</text>
    <line x1="25" y1="42" x2="685" y2="42" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Spec Data Grid -->
    <!-- Row 1: Subject -->
    <g transform="translate(25, 68)">
      <text x="0" y="0" class="mono bold" font-size="13" fill="#94A3B8">Subject</text>
      <line x1="75" y1="-4" x2="270" y2="-4" class="dotted"/>
      <text x="280" y="0" class="mono bold" font-size="14" fill="#F8FAFC">Swapnil Sanjay Patil</text>
    </g>

    <!-- Row 2: Role -->
    <g transform="translate(25, 96)">
      <text x="0" y="0" class="mono bold" font-size="13" fill="#94A3B8">Role</text>
      <line x1="50" y1="-4" x2="270" y2="-4" class="dotted"/>
      <text x="280" y="0" class="mono bold" font-size="13" fill="#22D3EE">Computer Science Engineer</text>
    </g>

    <!-- Row 3: Focus -->
    <g transform="translate(25, 124)">
      <text x="0" y="0" class="mono bold" font-size="13" fill="#94A3B8">Focus</text>
      <line x1="60" y1="-4" x2="270" y2="-4" class="dotted"/>
      <text x="280" y="0" class="mono" font-size="13" fill="#A78BFA">AI / ML · Data Analytics · UI/UX</text>
    </g>

    <!-- Row 4: Status Pill -->
    <g transform="translate(25, 152)">
      <text x="0" y="0" class="mono bold" font-size="13" fill="#94A3B8">Status</text>
      <line x1="65" y1="-4" x2="270" y2="-4" class="dotted"/>
      <rect x="280" y="-14" width="225" height="20" rx="4" fill="#064E3B"/>
      <text x="290" y="0" class="mono bold" font-size="11" fill="#10B981">Building + Learning + Shipping 🚀</text>
    </g>

    <!-- Mini Skill Bar Section inside Banner -->
    <line x1="25" y1="172" x2="685" y2="172" stroke="#1E293B" stroke-width="1"/>
    <text x="25" y="190" class="mono bold" font-size="11" fill="#64748B" letter-spacing="1">GRAPHICAL PROFICIENCY METRICS</text>

    <!-- Metric Bar 1: AI / Machine Learning -->
    <g transform="translate(25, 212)">
      <text x="0" y="0" class="mono" font-size="11" fill="#CBD5E1">AI / ML &amp; Neural Nets</text>
      <text x="230" y="0" text-anchor="end" class="mono bold" font-size="11" fill="#22D3EE">92%</text>
      <rect x="245" y="-10" width="410" height="12" rx="6" fill="#1E293B"/>
      <rect x="245" y="-10" width="377" height="12" rx="6" fill="url(#bar-ai-grad)"/>
    </g>

    <!-- Metric Bar 2: Software & Web Eng -->
    <g transform="translate(25, 238)">
      <text x="0" y="0" class="mono" font-size="11" fill="#CBD5E1">Full-Stack &amp; Web Eng</text>
      <text x="230" y="0" text-anchor="end" class="mono bold" font-size="11" fill="#A78BFA">90%</text>
      <rect x="245" y="-10" width="410" height="12" rx="6" fill="#1E293B"/>
      <rect x="245" y="-10" width="369" height="12" rx="6" fill="url(#bar-dev-grad)"/>
    </g>

    <!-- Metric Bar 3: UI/UX & 3D Design -->
    <g transform="translate(25, 264)">
      <text x="0" y="0" class="mono" font-size="11" fill="#CBD5E1">UI/UX &amp; 3D Modeling</text>
      <text x="230" y="0" text-anchor="end" class="mono bold" font-size="11" fill="#10B981">88%</text>
      <rect x="245" y="-10" width="410" height="12" rx="6" fill="#1E293B"/>
      <rect x="245" y="-10" width="360" height="12" rx="6" fill="url(#bar-ux-grad)"/>
    </g>

    <!-- Metric Bar 4: Data Science & Analytics -->
    <g transform="translate(25, 290)">
      <text x="0" y="0" class="mono" font-size="11" fill="#CBD5E1">Data Analytics &amp; Prep</text>
      <text x="230" y="0" text-anchor="end" class="mono bold" font-size="11" fill="#38BDF8">85%</text>
      <rect x="245" y="-10" width="410" height="12" rx="6" fill="#1E293B"/>
      <rect x="245" y="-10" width="348" height="12" rx="6" fill="url(#cyan-purple-grad)"/>
    </g>

    <!-- Bottom Location & Contacts Bar -->
    <line x1="25" y1="322" x2="685" y2="322" stroke="#1E293B" stroke-width="1.5"/>
    <g transform="translate(25, 352)">
      <text x="0" y="0" class="mono" font-size="11" fill="#64748B">MAIL: <tspan fill="#22D3EE">swapnilp3104@gmail.com</tspan></text>
      <text x="310" y="0" class="mono" font-size="11" fill="#64748B">LOC: <tspan fill="#10B981">India 🇮🇳</tspan></text>
      <text x="520" y="0" class="mono" font-size="11" fill="#64748B">GITHUB: <tspan fill="#A78BFA">@swapnil3104</tspan></text>
    </g>
  </g>
</svg>